name: Bug report
description: Something in ReadThatOut is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Page URL
      description: Optional. Skip this if the page is private.
      placeholder: https://
    validations:
      required: false
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: e.g. 140
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Windows 11
    validations:
      required: false
